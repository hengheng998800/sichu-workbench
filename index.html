<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>工作台</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5;color:#333;-webkit-tap-highlight-color:transparent;margin:0;padding:0;overflow:hidden;height:100vh;height:100dvh}
.app{display:flex;max-width:430px;margin:0 auto;background:#fff;height:100vh;height:100dvh;overflow:hidden}

/* ===== 左侧导航 ===== */
.sidebar{width:44px;min-width:44px;background:#3a3f47;display:flex;flex-direction:column;align-items:center;padding-top:12px;z-index:150}
.sidebar-item{display:flex;flex-direction:column;align-items:center;justify-content:center;width:38px;height:48px;border-radius:8px;margin-bottom:4px;cursor:pointer;color:rgba(255,255,255,0.5);transition:.2s;position:relative}
.sidebar-item.active{color:#fff;background:rgba(255,255,255,0.12)}
.sidebar-item svg{width:20px;height:20px}
.sidebar-item span{font-size:9px;margin-top:1px;line-height:1}
.sidebar-item .badge{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#ff6b6b}

/* ===== 主内容区 ===== */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:0}

/* 模块容器 */
.module{display:none;flex-direction:column;height:100%;overflow:hidden}
.module.active{display:flex}

/* ===== 工作台模块内嵌 ===== */
.workbench-pages{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:60px;position:relative}
.page{display:none}
.page.active{display:block}

.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:100}
.header .title{font-size:18px;font-weight:600}
.header .icons{display:flex;gap:16px}
.header .icons svg{width:22px;height:22px;color:#666}

.tabs{display:flex;padding:8px 12px;gap:8px;overflow-x:auto;background:#fff;border-bottom:1px solid #eee;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:16px;font-size:13px;white-space:nowrap;cursor:pointer;background:#f0f0f0;color:#666;transition:.2s}
.tab.active{background:#6B7A8F;color:#fff}

.dish-list{padding:8px 12px}
.dish-card{display:flex;align-items:flex-start;padding:12px;margin-bottom:8px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.dish-img{width:72px;height:72px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,#f0f0f0,#e0e0e0);display:flex;align-items:center;justify-content:center;color:#999;font-size:12px}
.dish-info{flex:1;margin-left:12px;min-width:0}
.dish-tag{display:inline-block;font-size:11px;color:#6B7A8F;margin-bottom:4px}
.dish-name{font-size:16px;font-weight:600;color:#333;margin-bottom:6px}
.dish-meta{display:flex;align-items:center;gap:4px;font-size:12px;color:#999}
.dish-meta svg{width:14px;height:14px}
.dish-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:8px}
.dish-count{display:flex;align-items:center;gap:2px;font-size:12px;color:#999}
.dish-count svg{width:16px;height:16px}
.btn-schedule{padding:6px 14px;border-radius:16px;font-size:13px;border:1px solid #ddd;background:#fff;color:#666;cursor:pointer}

/* 底部导航 - 仅在工作台模块内 */
.workbench-nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:10px 0;background:#fff;border-top:1px solid #eee;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 12px}
.nav-item svg{width:24px;height:24px;color:#999}
.nav-item span{font-size:11px;color:#999}
.nav-item.active svg,.nav-item.active span{color:#6B7A8F}

/* ===== 日历 ===== */
.calendar-bar{background:#6B7A8F;padding:16px 0 20px;color:#fff}
.calendar-weekdays{display:flex;justify-content:space-around;font-size:12px;margin-bottom:8px;opacity:.8}
.calendar-days{display:flex;justify-content:space-around;align-items:center}
.calendar-day{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 8px;border-radius:50%}
.calendar-day .month{font-size:10px;opacity:.7}
.calendar-day .day{font-size:18px;font-weight:500}
.calendar-day.active{background:#fff;color:#6B7A8F}
.calendar-day.active .month{opacity:1;color:#6B7A8F}

/* ===== 计划 ===== */
.empty-state{text-align:center;padding:60px 20px}
.empty-state p{font-size:15px;color:#999;margin-bottom:24px}
.btn-add{display:inline-block;padding:12px 40px;background:#6B7A8F;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.plan-list{padding:12px}
.plan-section-title{font-size:13px;color:#6B7A8F;padding:4px 0 8px 4px;font-weight:600}
.plan-item{display:flex;align-items:center;padding:14px 12px;background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.plan-check{width:22px;height:22px;border:2px solid #ddd;border-radius:50%;margin-right:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.plan-check.checked{background:#6B7A8F;border-color:#6B7A8F}
.plan-check.checked::after{content:'✓';color:#fff;font-size:13px}
.plan-info{flex:1}
.plan-info .name{font-size:15px;font-weight:500;color:#333}
.plan-info .name.done{text-decoration:line-through;color:#999}
.plan-info .tag{font-size:11px;color:#6B7A8F;margin-top:2px}
.plan-delete{padding:4px 10px;font-size:12px;color:#999;cursor:pointer}

/* ===== 采购 ===== */
.purchase-header{display:flex;align-items:center;justify-content:space-between;padding:16px;background:#fff;border-bottom:1px solid #eee;flex-wrap:wrap;gap:8px}
.date-nav{display:flex;align-items:center;gap:12px;background:#6B7A8F;color:#fff;padding:8px 20px;border-radius:20px;font-size:15px}
.date-nav button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
.view-toggle{display:flex;gap:8px}
.view-toggle button{padding:6px 14px;border-radius:16px;font-size:13px;border:1px solid #ddd;background:#fff;color:#666;cursor:pointer}
.view-toggle button.active{background:#6B7A8F;color:#fff;border-color:#6B7A8F}
.purchase-empty{text-align:center;padding:60px 20px;color:#999;font-size:15px}
.purchase-list{padding:12px}
.purchase-category{margin-bottom:16px}
.purchase-category-title{font-size:14px;font-weight:600;color:#6B7A8F;margin-bottom:8px;padding-left:4px}
.purchase-item{display:flex;align-items:center;padding:12px;background:#fff;border-radius:10px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.purchase-check{width:20px;height:20px;border:2px solid #ddd;border-radius:4px;margin-right:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.purchase-check.checked{background:#6B7A8F;border-color:#6B7A8F}
.purchase-check.checked::after{content:'✓';color:#fff;font-size:12px}
.purchase-detail{flex:1}
.purchase-detail .name{font-size:15px;color:#333}
.purchase-detail .name.done{text-decoration:line-through;color:#999}
.purchase-detail .source{font-size:11px;color:#999;margin-top:2px}

/* ===== 弹窗 ===== */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;width:100%;max-width:430px;border-radius:20px 20px 0 0;max-height:80vh;overflow-y:auto;padding:20px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h3{font-size:17px;font-weight:600}
.modal-close{font-size:24px;color:#999;cursor:pointer;background:none;border:none}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:#666;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;font-family:inherit}
.ingredient-row{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.ingredient-row input{flex:1;min-width:60px;padding:8px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.ingredient-row .qty-input{flex:0 0 55px;min-width:40px}
.ingredient-row .unit-input{flex:0 0 50px;min-width:36px}
.ingredient-row select{flex:0 0 70px;min-width:60px;padding:8px 4px;border:1px solid #ddd;border-radius:6px;font-size:12px;background:#fff}
.ingredient-row .btn-remove{padding:6px 10px;background:#ff6b6b;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;flex-shrink:0}
.btn-add-ingredient{padding:8px 16px;background:#f0f0f0;border:1px dashed #ccc;border-radius:6px;font-size:13px;color:#666;cursor:pointer;width:100%;margin-bottom:16px}
.btn-submit{width:100%;padding:14px;background:#6B7A8F;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:500;cursor:pointer}

/* 菜品选择弹窗 */
.dish-select-list{max-height:50vh;overflow-y:auto}
.dish-select-item{display:flex;align-items:center;padding:12px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.dish-select-item.disabled{opacity:.4;pointer-events:none}
.dish-select-item .dish-thumb{width:48px;height:48px;border-radius:6px;margin-right:12px;background:linear-gradient(135deg,#f0f0f0,#e0e0e0);display:flex;align-items:center;justify-content:center;color:#999;font-size:10px}
.dish-select-item .info{flex:1}
.dish-select-item .name{font-size:15px;font-weight:500}
.dish-select-item .tag{font-size:11px;color:#6B7A8F}
.dish-select-item .check-circle{width:22px;height:22px;border:2px solid #ddd;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px}
.dish-select-item.selected .check-circle{background:#6B7A8F;border-color:#6B7A8F;color:#fff}

.date-option{padding:10px 14px;margin-bottom:6px;background:#f5f5f5;border-radius:8px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.date-option:hover{background:#e8e8e8}
.date-option .pick{color:#6B7A8F;font-size:13px}

/* ===== 设定页 ===== */
.settings-page{padding:16px}
.settings-section{background:#fff;border-radius:12px;margin-bottom:12px;overflow:hidden}
.settings-section-title{padding:12px 16px;font-size:13px;color:#999;font-weight:500}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid #f0f0f0;cursor:pointer}
.settings-item span{font-size:15px;color:#333}
.settings-item svg{width:18px;height:18px;color:#ccc}
.fab{position:absolute;bottom:80px;right:20px;width:56px;height:56px;border-radius:50%;background:#6B7A8F;color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:90;display:flex;align-items:center;justify-content:center}
.hidden{display:none!important}

/* ===== 菜品流程模块 ===== */
.flow-module{padding:0;overflow:hidden;display:flex;flex-direction:column;height:100%}
.flow-dish-select{padding:12px;background:#fff;border-bottom:1px solid #eee}
.flow-dish-select select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;background:#fff}
.flow-steps{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.flow-step{display:flex;align-items:flex-start;padding:12px;background:#fff;border-radius:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}
.flow-step-num{width:28px;height:28px;border-radius:50%;background:#6B7A8F;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;margin-right:12px;margin-top:2px}
.flow-step-content{flex:1;min-width:0}
.flow-step-content .step-title{font-size:15px;font-weight:500;color:#333;margin-bottom:4px}
.flow-step-content .step-desc{font-size:13px;color:#666;line-height:1.5}
.flow-step-actions{display:flex;flex-direction:column;gap:4px;margin-left:8px;flex-shrink:0}
.flow-step-actions button{padding:4px 8px;font-size:11px;border:1px solid #ddd;background:#fff;border-radius:4px;color:#999;cursor:pointer}
.flow-step-actions .flow-step-del{color:#ff6b6b;border-color:#ff6b6b}
.flow-step-line{position:absolute;left:25px;top:52px;bottom:-8px;width:2px;background:#e0e0e0;z-index:0}
.flow-step:last-child .flow-step-line{display:none}

/* ===== 每日轨迹模块 ===== */
.track-module{padding:0;overflow:hidden;display:flex;flex-direction:column;height:100%}
.track-header{padding:16px;background:#fff;border-bottom:1px solid #eee;text-align:center}
.track-header .date-display{font-size:17px;font-weight:600;color:#333}
.track-header .date-nav-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px}
.track-header .date-nav-row button{background:#6B7A8F;border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.track-timeline{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.track-item{display:flex;align-items:flex-start;margin-bottom:0;position:relative}
.track-time{width:56px;flex-shrink:0;text-align:right;padding-right:12px;font-size:13px;font-weight:600;color:#6B7A8F;padding-top:10px}
.track-dot{width:14px;height:14px;border-radius:50%;background:#6B7A8F;flex-shrink:0;margin-top:12px;position:relative;z-index:1}
.track-dot.done{background:#aaa}
.track-line{position:absolute;left:66px;top:32px;bottom:-16px;width:2px;background:#e0e0e0;z-index:0}
.track-item:last-child .track-line{display:none}
.track-card{flex:1;margin-left:12px;margin-bottom:12px;background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.track-card .track-title{font-size:15px;font-weight:500;color:#333;margin-bottom:4px}
.track-card .track-title.done{text-decoration:line-through;color:#999}
.track-card .track-note{font-size:12px;color:#999}
.track-card .track-actions{display:flex;gap:8px;margin-top:8px}
.track-card .track-actions button{padding:4px 10px;font-size:11px;border:1px solid #ddd;background:#fff;border-radius:4px;color:#666;cursor:pointer}
.track-card .track-actions .track-del{color:#ff6b6b;border-color:#ff6b6b}
.track-card .track-check{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;font-size:12px;border:1px solid #ddd;background:#fff;border-radius:14px;color:#666;cursor:pointer;margin-top:6px}
.track-card .track-check.done{background:#6B7A8F;color:#fff;border-color:#6B7A8F}
.track-add-row{display:flex;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #eee;align-items:flex-end}
.track-add-row input{flex:1;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px}
.track-add-row .time-input{flex:0 0 72px}
.track-add-row button{padding:8px 16px;background:#6B7A8F;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;white-space:nowrap}
.track-empty{text-align:center;padding:60px 20px;color:#999;font-size:15px}
</style>
</head>
<body>
<div class="app">

<!-- ========== 左侧导航栏 ========== -->
<div class="sidebar">
  <div class="sidebar-item active" data-module="workbench">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    <span>工作台</span>
  </div>
  <div class="sidebar-item" data-module="flow">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    <span>流程</span>
  </div>
  <div class="sidebar-item" data-module="track">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>轨迹</span>
  </div>
</div>

<!-- ========== 主内容区 ========== -->
<div class="main-content">

<!-- ========== 模块1: 工作台 ========== -->
<div class="module active" id="module-workbench">
<div class="workbench-pages" id="workbench-pages">

<!-- 菜单页 -->
<div class="page active" id="page-menu">
  <div class="header">
    <div class="title">工作台</div>
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </div>
  </div>
  <div class="tabs" id="menu-tabs">
    <div class="tab active" data-filter="all">全部</div>
  </div>
  <div class="dish-list" id="dish-list"></div>
  <button class="fab" id="btn-add-dish">+</button>
</div>

<!-- 计划页 -->
<div class="page" id="page-plan">
  <div class="header">
    <div class="title">计划</div>
  </div>
  <div class="calendar-bar" id="calendar-bar"></div>
  <div id="plan-content">
    <div class="empty-state">
      <p>尚无料理计划</p>
      <button class="btn-add" id="btn-add-plan">追加</button>
    </div>
  </div>
</div>

<!-- 采购页 -->
<div class="page" id="page-purchase">
  <div class="header">
    <div class="title">采购</div>
  </div>
  <div class="purchase-header">
    <div class="date-nav">
      <button id="purchase-prev">◀</button>
      <span id="purchase-date">07/31 (五)</span>
      <button id="purchase-next">▶</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:#666;cursor:pointer">
        <input type="checkbox" id="show-done-purchase" style="width:16px;height:16px">显示已完成
      </label>
      <div class="view-toggle">
        <button class="active" data-view="day">单日</button>
        <button data-view="3day">三日</button>
        <button data-view="week">一周</button>
      </div>
    </div>
  </div>
  <div id="purchase-content">
    <div class="purchase-empty">尚无采购食材</div>
  </div>
</div>

<!-- 设定页 -->
<div class="page" id="page-settings">
  <div class="header">
    <div class="title">设定</div>
  </div>
  <div class="settings-page">
    <div class="settings-section">
      <div class="settings-section-title">数据管理</div>
      <div class="settings-item" id="btn-export"><span>导出数据</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>
      <div class="settings-item" id="btn-import"><span>导入数据</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>
      <div class="settings-item" id="btn-clear"><span>清空所有数据</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">工作分类管理</div>
      <div id="cat-list"></div>
      <div style="padding:12px 16px">
        <div style="display:flex;gap:8px">
          <input type="text" id="new-cat-name" placeholder="分类名称" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px">
          <input type="text" id="new-cat-icon" placeholder="图标" maxlength="2" style="width:50px;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;text-align:center">
          <button onclick="addCategory()" style="padding:8px 16px;background:#6B7A8F;color:#fff;border:none;border-radius:6px;font-size:14px">添加</button>
        </div>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">食材分类管理</div>
      <div id="ing-cat-list"></div>
      <div style="padding:12px 16px">
        <div style="display:flex;gap:8px">
          <input type="text" id="new-ing-cat-name" placeholder="分类名称" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px">

<script>
// ============ 数据模型 ============
var STORAGE_KEY = 'sc_v2';
var appData;
var selectedPlanDate = new Date();
var selectedPurchaseDate = new Date();
var purchaseView = 'day';
var showDonePurchase = false;
var selectedDishesForPlan = [];
var pendingPlanDishId = null;
var currentModule = 'workbench';
var selectedTrackDate = new Date();

function getDefaultData() {
  return {
    dishes: [
      {id:'d1',name:'梅菜肉饼',category:'fastfood',ingredients:[{name:'猪肉',qty:'5',unit:'斤',category:'meat'},{name:'梅菜',qty:'1',unit:'斤',category:'veg'}],lastDate:'2024-07-20',planCount:1},
      {id:'d2',name:'韭菜饺',category:'fastfood',ingredients:[{name:'猪肉',qty:'5',unit:'斤',category:'meat'},{name:'韭菜',qty:'2',unit:'斤',category:'veg'},{name:'饺子皮',qty:'3',unit:'斤',category:'noodle'}],lastDate:'2024-07-20',planCount:1},
      {id:'d3',name:'玉米饺',category:'fastfood',ingredients:[{name:'猪肉',qty:'10',unit:'斤',category:'meat'},{name:'玉米',qty:'3',unit:'斤',category:'veg'},{name:'饺子皮',qty:'5',unit:'斤',category:'noodle'}],lastDate:null,planCount:0},
      {id:'d4',name:'咸水角(皮)',category:'fastfood',ingredients:[{name:'糯米粉',qty:'2',unit:'斤',category:'noodle'},{name:'澄面',qty:'0.5',unit:'斤',category:'noodle'}],lastDate:'2024-07-06',planCount:1},
      {id:'d5',name:'咸水角(馅)',category:'fastfood',ingredients:[{name:'猪肉',qty:'3',unit:'斤',category:'meat'},{name:'虾米',qty:'0.5',unit:'斤',category:'dry'},{name:'韭菜',qty:'1',unit:'斤',category:'veg'}],lastDate:'2024-07-29',planCount:2}
    ],
    plans:{},
    purchaseDone:{},
    categories:[
      {id:'fastfood',name:'快餐工作',icon:'🥟'},
      {id:'breakfast',name:'早餐工作',icon:'🥐'}
    ],
    ingCategories:[
      {id:'meat',name:'肉类',icon:'🥩'},
      {id:'veg',name:'蔬菜',icon:'🥬'},
      {id:'noodle',name:'面类',icon:'🍜'},
      {id:'dry',name:'干货',icon:'📦'},
      {id:'other',name:'其他',icon:'📋'}
    ],
    // 新增：菜品流程数据 {dishId: [{id,title,desc,order}]}
    flowSteps: {},
    // 新增：每日轨迹数据 {dateKey: [{id,time,title,done,note}]}
    tracks: {}
  };
}

function loadData() {
  try {
    var d = localStorage.getItem(STORAGE_KEY);
    if (d) {
      var p = JSON.parse(d);
      // 确保新字段存在
      if (!p.flowSteps) p.flowSteps = {};
      if (!p.tracks) p.tracks = {};
      if (Array.isArray(p.dishes) && p.dishes.length > 0) return p;
    }
  } catch(e) {}
  localStorage.removeItem(STORAGE_KEY);
  var def = getDefaultData();
  saveData(def);
  return def;
}

function saveData(d) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
}

appData = loadData();

// ============ 工具函数 ============
function fmtDate(d) {
  var m = d.getMonth()+1, day = d.getDate();
  var w = ['日','一','二','三','四','五','六'];
  return (m<10?'0':'')+m+'/'+(day<10?'0':'')+day+' ('+w[d.getDay()]+')';
}
function dateKey(d) {
  return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();
}
function getCats() { return appData.categories || [{id:'fastfood',name:'快餐工作',icon:'🥟'},{id:'breakfast',name:'早餐工作',icon:'🥐'}]; }
function catName(c) { var cat = getCats().find(function(x){return x.id===c}); return cat ? '【'+cat.name+'】' : '【'+c+'】'; }
function catLabel(c) { var cat = getCats().find(function(x){return x.id===c}); return cat ? cat.icon+' '+cat.name : c; }
function ingLabel(c) {
  var cats = getIngCats();
  var cat = cats.find(function(x){return x.id===c});
  return cat ? cat.icon+' '+cat.name : '📋 其他';
}
function getIngCats() { return appData.ingCategories || [{id:'meat',name:'肉类',icon:'🥩'},{id:'veg',name:'蔬菜',icon:'🥬'},{id:'noodle',name:'面类',icon:'🍜'},{id:'dry',name:'干货',icon:'📦'},{id:'other',name:'其他',icon:'📋'}]; }

// ============ 模块切换 ============
function switchModule(mod) {
  currentModule = mod;
  document.querySelectorAll('.module').forEach(function(el){el.classList.remove('active')});
  document.getElementById('module-'+mod).classList.add('active');
  document.querySelectorAll('.sidebar-item').forEach(function(el){el.classList.remove('active')});
  document.querySelector('.sidebar-item[data-module="'+mod+'"]').classList.add('active');

  if (mod==='workbench') {
    // 确保当前工作台页面渲染
    var curPage = (document.querySelector('.nav-item.active')||{}).dataset||{page:'menu'};
    switchPage(curPage.page||'menu');
  }
  if (mod==='flow') renderFlow();
  if (mod==='track') renderTrack();
}

document.querySelectorAll('.sidebar-item').forEach(function(item){
  item.addEventListener('click',function(){ switchModule(this.dataset.module); });
});

// ============ 工作台页面切换 ============
function switchPage(p) {
  document.querySelectorAll('.page').forEach(function(el){el.classList.remove('active')});
  var pageEl = document.getElementById('page-'+p);
  if (pageEl) pageEl.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('active')});
  var navEl = document.querySelector('.nav-item[data-page="'+p+'"]');
  if (navEl) navEl.classList.add('active');
  if (p==='menu') renderMenu();
  if (p==='plan') renderPlan();
  if (p==='purchase') renderPurchase();
  if (p==='settings') { renderCategories(); renderIngCategories(); }
}
document.querySelectorAll('.nav-item').forEach(function(item){
  item.addEventListener('click',function(){switchPage(this.dataset.page)});
});

// ============ 菜单页 ============
function renderMenu() {
  var filter = (document.querySelector('#menu-tabs .tab.active')||{}).dataset||{filter:'all'};
  filter = filter.filter||'all';
  var list = document.getElementById('dish-list');
  
  var tabs = document.getElementById('menu-tabs');
  tabs.innerHTML = '<div class="tab'+(filter==='all'?' active':'')+'" data-filter="all">全部</div>';
  var cats = getCats();
  for (var i=0;i<cats.length;i++) {
    tabs.innerHTML += '<div class="tab'+(filter===cats[i].id?' active':'')+'" data-filter="'+cats[i].id+'">'+cats[i].icon+' '+cats[i].name+'</div>';
  }
  tabs.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      tabs.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
      this.classList.add('active');
      renderMenu();
    });
  });
  
  var dishes = appData.dishes;
  if (!dishes || dishes.length===0) {
    list.innerHTML = '<div style="text-align:center;padding:60px 20px"><p style="color:#999;font-size:15px;margin-bottom:16px">暂无菜品</p><button style="padding:12px 40px;background:#6B7A8F;color:#fff;border:none;border-radius:8px;font-size:16px" onclick="initDefaultData()">加载默认菜品</button></div>';
    return;
  }
  if (filter!=='all') dishes = dishes.filter(function(d){return d.category===filter});
  var html = '';
  for (var i=0;i<dishes.length;i++) {
    var d = dishes[i];
    html += '<div class="dish-card"><div class="dish-img" style="background-image:url('+ (d.image||'') + ');background-size:cover;background-position:center">' + (d.image?'':'暂无图片') + '</div><div class="dish-info"><div class="dish-tag">'+catName(d.category)+'</div><div class="dish-name">'+d.name+'</div><div class="dish-meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Last '+(d.lastDate||'尚未料理')+'</span></div></div><div class="dish-actions"><button class="btn-schedule btn-edit-dish" data-id="'+d.id+'" style="background:#f0f0f0;border:none;margin-bottom:4px">编辑</button><button class="btn-schedule btn-plan-dish" data-id="'+d.id+'">排定</button></div></div>';
  }
  list.innerHTML = html;
  list.querySelectorAll('.btn-edit-dish').forEach(function(el){ el.addEventListener('click',function(){ editDish(this.dataset.id); }); });
  list.querySelectorAll('.btn-plan-dish').forEach(function(el){ el.addEventListener('click',function(){ openPlanModal(this.dataset.id); }); });
}

// ============ 添加/编辑菜品 ============
function makeIngRow(selectedCat) {
  var row = document.createElement('div');
  row.className = 'ingredient-row';
  var cats = getIngCats();
  var opts = '';
  for (var i=0;i<cats.length;i++) {
    opts += '<option value="'+cats[i].id+'"'+(cats[i].id===selectedCat?' selected':'')+'>'+cats[i].icon+cats[i].name+'</option>';
  }
  row.innerHTML = '<input type="text" placeholder="食材" class="ing-name"><input type="text" placeholder="数量" class="qty-input ing-qty"><input type="text" placeholder="单位" class="unit-input ing-unit"><select class="ing-cat">'+opts+'</select><button class="btn-remove" onclick="this.parentElement.remove()">&times;</button>';
  return row;
}
document.getElementById('btn-add-dish').addEventListener('click',function(){
  document.getElementById('dish-name').value = '';
  editingDishId = null;
  var catSel = document.getElementById('dish-category');
  catSel.innerHTML = '';
  var cats = getCats();
  for (var i=0;i<cats.length;i++) {
    catSel.innerHTML += '<option value="'+cats[i].id+'">'+cats[i].icon+' '+cats[i].name+'</option>';
  }
  pendingDishImage = '';
  document.getElementById('dish-image-preview').style.backgroundImage = '';
  document.getElementById('dish-image-preview').textContent = '点击上传图片';
  document.getElementById('dish-image-input').value = '';
  var list = document.getElementById('ingredient-list');
  list.innerHTML = '';
  list.appendChild(makeIngRow());
  openModal('modal-dish');
});
function addIngredient() {
  document.getElementById('ingredient-list').appendChild(makeIngRow());
}
var pendingDishImage = '';
var editingDishId = null;

function previewDishImage(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 200;
      var ratio = maxW / img.width;
      canvas.width = maxW;
      canvas.height = img.height * ratio;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingDishImage = canvas.toDataURL('image/jpeg', 0.6);
      document.getElementById('dish-image-preview').style.backgroundImage = 'url(' + pendingDishImage + ')';
      document.getElementById('dish-image-preview').textContent = '';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function editDish(dishId) {
  var dish = appData.dishes.find(function(d){return d.id===dishId});
  if (!dish) return;
  editingDishId = dishId;
  document.getElementById('dish-name').value = dish.name;
  var catSel = document.getElementById('dish-category');
  catSel.innerHTML = '';
  var cats = getCats();
  for (var i=0;i<cats.length;i++) {
    catSel.innerHTML += '<option value="'+cats[i].id+'"'+(cats[i].id===dish.category?' selected':'')+'>'+cats[i].icon+' '+cats[i].name+'</option>';
  }
  pendingDishImage = dish.image || '';
  var preview = document.getElementById('dish-image-preview');
  if (dish.image) {
    preview.style.backgroundImage = 'url('+dish.image+')';
    preview.textContent = '';
  } else {
    preview.style.backgroundImage = '';
    preview.textContent = '点击上传图片';
  }
  document.getElementById('dish-image-input').value = '';
  var list = document.getElementById('ingredient-list');
  list.innerHTML = '';
  for (var i=0;i<dish.ingredients.length;i++) {
    var ing = dish.ingredients[i];
    list.appendChild(makeIngRow(ing.category));
    var rows = list.querySelectorAll('.ingredient-row');
    var lastRow = rows[rows.length-1];
    lastRow.querySelector('.ing-name').value = ing.name;
    lastRow.querySelector('.ing-qty').value = ing.qty;
    lastRow.querySelector('.ing-unit').value = ing.unit;
  }
  if (dish.ingredients.length===0) list.appendChild(makeIngRow());
  openModal('modal-dish');
}

function saveDish() {
  var name = document.getElementById('dish-name').value.trim();
  if (!name) { alert('请输入菜品名称'); return; }
  var ings = [];
  document.querySelectorAll('#ingredient-list .ingredient-row').forEach(function(row){
    var n = row.querySelector('.ing-name').value.trim();
    var q = row.querySelector('.ing-qty').value.trim();
    var u = row.querySelector('.ing-unit').value.trim();
    var c = row.querySelector('.ing-cat').value;
    if (n) ings.push({name:n,qty:q||'1',unit:u||'斤',category:c});
  });
  if (editingDishId) {
    var dish = appData.dishes.find(function(d){return d.id===editingDishId});
    if (dish) {
      dish.name = name;
      dish.category = document.getElementById('dish-category').value;
      dish.image = pendingDishImage;
      dish.ingredients = ings;
    }
    editingDishId = null;
  } else {
    appData.dishes.push({id:'d'+Date.now(),name:name,category:document.getElementById('dish-category').value,image:pendingDishImage,ingredients:ings,lastDate:null,planCount:0});
  }
  saveData(appData);
  closeModal('modal-dish');
  renderMenu();
}

// ============ 排定日期弹窗 ============
function openPlanModal(dishId) {
  pendingPlanDishId = dishId;
  var today = new Date();
  var html = '<div style="padding:0 0 8px 0"><div style="margin-bottom:12px;font-size:15px;color:#333;font-weight:500">选择排定日期</div>';
  for (var i=0;i<14;i++) {
    var d = new Date(today);
    d.setDate(d.getDate()+i);
    var dk = dateKey(d);
    var label = i===0 ? '今天 '+fmtDate(d) : fmtDate(d);
    html += '<div class="date-option" data-dk="'+dk+'"><span>'+label+'</span><span class="pick">选择 ›</span></div>';
  }
  html += '</div>';
  var selList = document.getElementById('dish-select-list');
  selList.innerHTML = html;
  selList.querySelectorAll('.date-option').forEach(function(el){ el.addEventListener('click',function(){ doPlanDish(this.dataset.dk); }); });
  document.getElementById('modal-select-title').textContent = '选择排定日期';
  document.getElementById('btn-confirm-plan').style.display = 'none';
  openModal('modal-select-dish');
}
function doPlanDish(dk) {
  if (!pendingPlanDishId) return;
  if (!appData.plans[dk]) appData.plans[dk] = [];
  if (appData.plans[dk].some(function(p){return p.id===pendingPlanDishId})) {
    alert('该菜品已在该日期计划中');
    closeModal('modal-select-dish');
    return;
  }
  var dish = appData.dishes.find(function(d){return d.id===pendingPlanDishId});
  if (dish) {
    appData.plans[dk].push({id:dish.id,name:dish.name,category:dish.category,done:false});
    saveData(appData);
    closeModal('modal-select-dish');
    alert('已添加');
    renderPlan();
    renderPurchase();
  }
  pendingPlanDishId = null;
}

// ============ 计划页 ============
function renderCalendar() {
  var bar = document.getElementById('calendar-bar');
  var wd = ['日','一','二','三','四','五','六'];
  var weekStart = new Date(selectedPlanDate);
  weekStart.setDate(weekStart.getDate() - weekStart.getDay());
  var weekEnd = new Date(weekStart);
  weekEnd.setDate(weekEnd.getDate() + 6);
  var html = '<div style="display:flex;align-items:center;justify-content:space-between;padding:0 8px;margin-bottom:8px">';
  html += '<span class="cal-prev" style="font-size:18px;cursor:pointer;padding:4px 8px">◀</span>';
  html += '<span style="font-size:13px;opacity:0.9">'+(weekStart.getMonth()+1)+'/'+weekStart.getDate()+' - '+(weekEnd.getMonth()+1)+'/'+weekEnd.getDate()+'</span>';
  html += '<span class="cal-next" style="font-size:18px;cursor:pointer;padding:4px 8px">▶</span>';
  html += '</div>';
  html += '<div class="calendar-weekdays">';
  for (var i=0;i<7;i++) html += '<div>'+wd[i]+'</div>';
  html += '</div><div class="calendar-days">';
  for (var i=0;i<7;i++) {
    var d = new Date(selectedPlanDate);
    d.setDate(d.getDate()-d.getDay()+i);
    var active = d.toDateString()===selectedPlanDate.toDateString();
    var isToday = d.toDateString()===new Date().toDateString();
    html += '<div class="calendar-day'+(active?' active':'')+'" data-iso="'+d.toISOString()+'" style="position:relative">';
    if (isToday) html += '<div style="position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:8px;opacity:0.6">今</div>';
    html += '<div class="month">'+(d.getMonth()+1)+'月</div><div class="day">'+d.getDate()+'</div></div>';
  }
  html += '</div>';
  bar.innerHTML = html;
  bar.querySelectorAll('.calendar-day').forEach(function(el){ el.addEventListener('click',function(){ selectPlanDate(this.dataset.iso); }); });
  var prevBtn = bar.querySelector('.cal-prev');
  var nextBtn = bar.querySelector('.cal-next');
  if (prevBtn) prevBtn.addEventListener('click',function(){ selectedPlanDate.setDate(selectedPlanDate.getDate()-7); renderCalendar(); renderPlan(); });
  if (nextBtn) nextBtn.addEventListener('click',function(){ selectedPlanDate.setDate(selectedPlanDate.getDate()+7); renderCalendar(); renderPlan(); });
}
function selectPlanDate(iso) {
  selectedPlanDate = new Date(iso);
  renderCalendar();
  renderPlan();
}
function renderPlan() {
  renderCalendar();
  var dk = dateKey(selectedPlanDate);
  var plans = appData.plans[dk] || [];
  var content = document.getElementById('plan-content');
  var undonePlans = plans.filter(function(p){return !p.done});
  if (undonePlans.length===0) {
    content.innerHTML = '<div class="empty-state"><p>尚无料理计划</p><button class="btn-add" id="btn-add-plan">追加</button></div>';
    var btn = document.getElementById('btn-add-plan');
    if (btn) btn.addEventListener('click',openSelectDishModal);
    return;
  }
  var html = '<div class="plan-list">';
  var cats = getCats();
  for (var c=0;c<cats.length;c++) {
    var catPlans = plans.filter(function(p){
      if (p.done) return false;
      var dish = appData.dishes.find(function(d){return d.id===p.id});
      return (dish ? dish.category : p.category) === cats[c].id;
    });
    if (catPlans.length===0) continue;
    html += '<div class="plan-section-title"'+(c>0?' style="padding-top:12px"':'')+'>'+cats[c].icon+' '+cats[c].name+'</div>';
    for (var i=0;i<catPlans.length;i++) {
      var idx = plans.indexOf(catPlans[i]);
      var dish = appData.dishes.find(function(d){return d.id===catPlans[i].id});
      var displayCat = dish ? dish.category : catPlans[i].category;
      html += '<div class="plan-item"><div class="plan-check'+(catPlans[i].done?' checked':'')+'" data-dk="'+dk+'" data-idx="'+idx+'"></div><div class="plan-info"><div class="name'+(catPlans[i].done?' done':'')+'">'+catPlans[i].name+'</div><div class="tag">'+catName(displayCat)+'</div></div><div class="plan-delete" data-dk="'+dk+'" data-idx="'+idx+'">删除</div></div>';
    }
  }
  html += '</div><div style="text-align:center;padding:8px"><button class="btn-add" id="btn-add-plan">追加菜品</button></div>';
  content.innerHTML = html;
  content.querySelectorAll('.plan-check').forEach(function(el){ el.addEventListener('click',function(){ togglePlanDone(this.dataset.dk, parseInt(this.dataset.idx)); }); });
  content.querySelectorAll('.plan-delete').forEach(function(el){ el.addEventListener('click',function(){ removePlan(this.dataset.dk, parseInt(this.dataset.idx)); }); });
  var btnAdd = document.getElementById('btn-add-plan');
  if (btnAdd) btnAdd.addEventListener('click',openSelectDishModal);
}
function togglePlanDone(dk,idx) {
  appData.plans[dk][idx].done = !appData.plans[dk][idx].done;
  saveData(appData);
  renderPlan();
  renderPurchase();
}
function removePlan(dk,idx) {
  appData.plans[dk].splice(idx,1);
  if (appData.plans[dk].length===0) delete appData.plans[dk];
  saveData(appData);
  renderPlan();
  renderPurchase();
}

function openSelectDishModal() {
  selectedDishesForPlan = [];
  pendingPlanDishId = null;
  document.getElementById('modal-select-title').textContent = '选择菜品';
  document.getElementById('btn-confirm-plan').style.display = '';

function renderDishSelectList(filter) {
  var dk = dateKey(selectedPlanDate);
  var existIds = (appData.plans[dk]||[]).map(function(p){return p.id});
  var list = document.getElementById('dish-select-list');
  var html = '';
  var count = 0;
  for (var i=0;i<appData.dishes.length;i++) {
    var d = appData.dishes[i];
    if (filter && d.name.toLowerCase().indexOf(filter.toLowerCase())===-1) continue;
    var exist = existIds.indexOf(d.id)>-1;
    html += '<div class="dish-select-item'+(exist?' disabled':'')+(selectedDishesForPlan.indexOf(d.id)>-1?' selected':'')+'" data-id="'+d.id+'"><div class="dish-thumb" style="background-image:url('+ (d.image||'') + ');background-size:cover;background-position:center">' + (d.image?'':'暂无图片') + '</div><div class="info"><div class="name">'+d.name+(exist?' <span style="font-size:11px;color:#999">(已计划)</span>':'')+'</div><div class="tag">'+catLabel(d.category)+'</div></div><div class="check-circle">'+(exist?'✓':(selectedDishesForPlan.indexOf(d.id)>-1?'✓':''))+'</div></div>';

function toggleSelectDish(dishId) {
  var idx = selectedDishesForPlan.indexOf(dishId);

  else selectedDishesForPlan.push(dishId);

    item.classList.toggle('selected',selectedDishesForPlan.indexOf(item.dataset.id)>-1);
  });

function confirmPlan() {
  var dk = dateKey(selectedPlanDate);
  if (!appData.plans[dk]) appData.plans[dk] = [];
  for (var i=0;i<selectedDishesForPlan.length;i++) {
    var dishId = selectedDishesForPlan[i];
    if (appData.plans[dk].some(function(p){return p.id===dishId})) continue;
    var dish = appData.dishes.find(function(d){return d.id===dishId});

// ============ 采购页 ============
function renderPurchase() {
  document.getElementById('purchase-date').textContent = fmtDate(selectedPurchaseDate);
  var dates = [];
  if (purchaseView==='day') dates = [selectedPurchaseDate];
  else if (purchaseView==='3day') {
    for (var i=0;i<3;i++) { var d=new Date(selectedPurchaseDate);d.setDate(d.getDate()+i);dates.push(d); }
  } else {
    for (var i=0;i<7;i++) { var d=new Date(selectedPurchaseDate);d.setDate(d.getDate()+i);dates.push(d); }
  }
  var allItems = [];
  for (var i=0;i<dates.length;i++) {
    var dk = dateKey(dates[i]);
    var plans = appData.plans[dk] || [];
    for (var j=0;j<plans.length;j++) {
      if (plans[j].done) continue;
      var dish = appData.dishes.find(function(d){return d.id===plans[j].id});
      if (dish && dish.ingredients) {
        for (var k=0;k<dish.ingredients.length;k++) {
          allItems.push({name:dish.ingredients[k].name,qty:dish.ingredients[k].qty,unit:dish.ingredients[k].unit,category:dish.ingredients[k].category,dishName:dish.name,dateKey:dk,dishId:dish.id,idx:k});
        }
      }
    }
  }
  var content = document.getElementById('purchase-content');
  if (allItems.length===0) {
    content.innerHTML = '<div class="purchase-empty">尚无采购食材</div>';
    return;
  }
  var groups = {};
  for (var i=0;i<allItems.length;i++) {
    var item = allItems[i];
    var cat = item.category||'other';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(item);
  }
  var catOrder = getIngCats().map(function(c){return c.id});
  var html = '<div class="purchase-list">';
  for (var c=0;c<catOrder.length;c++) {
    var cat = catOrder[c];
    if (!groups[cat]) continue;
    html += '<div class="purchase-category"><div class="purchase-category-title">'+ingLabel(cat)+'</div>';
    for (var i=0;i<groups[cat].length;i++) {
      var item = groups[cat][i];
      var itemKey = item.dateKey+'-'+item.dishId+'-'+item.name+'-'+item.idx;
      var isDone = appData.purchaseDone[itemKey];
      if (isDone && !showDonePurchase) continue;
      html += '<div class="purchase-item"><div class="purchase-check'+(isDone?' checked':'')+'" data-key="'+itemKey+'"></div><div class="purchase-detail"><div class="name'+(isDone?' done':'')+'">'+item.name+' '+item.qty+item.unit+'</div><div class="source">('+item.dishName+')</div></div></div>';
    }
    html += '</div>';
  }
  html += '</div>';
  content.innerHTML = html;
  content.querySelectorAll('.purchase-check').forEach(function(el){ el.addEventListener('click',function(){ togglePurchaseDone(this.dataset.key); }); });
}
function togglePurchaseDone(key) {
  appData.purchaseDone[key] = !appData.purchaseDone[key];
  saveData(appData);
  renderPurchase();
}

  selectedPurchaseDate.setDate(selectedPurchaseDate.getDate()-1);

// ============ 菜品流程模块 ====================================
// ============================================================
function renderFlow() {
  // 更新菜品下拉框
  var sel = document.getElementById('flow-dish-selector');
  var currentVal = sel.value;
  sel.innerHTML = '<option value="">-- 选择菜品 --</option>';
  for (var i=0;i<appData.dishes.length;i++) {
    var d = appData.dishes[i];
    sel.innerHTML += '<option value="'+d.id+'"'+(d.id===currentVal?' selected':'')+'>'+d.name+'</option>';
  }

  var dishId = sel.value;
  var stepsContainer = document.getElementById('flow-steps');
  if (!dishId) {
    stepsContainer.innerHTML = '<div class="empty-state"><p>请先选择菜品，然后添加操作步骤</p></div>';
    return;
  }

  if (!appData.flowSteps) appData.flowSteps = {};
  var steps = appData.flowSteps[dishId] || [];

  if (steps.length===0) {
    stepsContainer.innerHTML = '<div class="empty-state"><p>暂无操作步骤</p><p style="font-size:13px;color:#999">在下方添加步骤</p></div>';
    return;
  }

  // 按 order 排序
  steps.sort(function(a,b){return (a.order||0)-(b.order||0)});

  var html = '';
  for (var i=0;i<steps.length;i++) {
    var s = steps[i];
    html += '<div class="flow-step">';
    html += '<div class="flow-step-line"></div>';
    html += '<div class="flow-step-num">'+(i+1)+'</div>';
    html += '<div class="flow-step-content">';
    html += '<div class="step-title">'+s.title+'</div>';
    if (s.desc) html += '<div class="step-desc">'+s.desc+'</div>';
    html += '</div>';
    html += '<div class="flow-step-actions">';
    html += '<button class="flow-step-edit" data-dish="'+dishId+'" data-idx="'+i+'">编辑</button>';
    if (i>0) html += '<button class="flow-step-up" data-dish="'+dishId+'" data-idx="'+i+'">▲</button>';
    if (i<steps.length-1) html += '<button class="flow-step-dn" data-dish="'+dishId+'" data-idx="'+i+'">▼</button>';
    html += '<button class="flow-step-del" data-dish="'+dishId+'" data-idx="'+i+'">删除</button>';
    html += '</div></div>';
  }
  stepsContainer.innerHTML = html;

  // 绑定事件
  stepsContainer.querySelectorAll('.flow-step-edit').forEach(function(el){ el.addEventListener('click',function(){ editFlowStep(this.dataset.dish, parseInt(this.dataset.idx)); }); });
  stepsContainer.querySelectorAll('.flow-step-up').forEach(function(el){ el.addEventListener('click',function(){ moveFlowStep(this.dataset.dish, parseInt(this.dataset.idx), -1); }); });
  stepsContainer.querySelectorAll('.flow-step-dn').forEach(function(el){ el.addEventListener('click',function(){ moveFlowStep(this.dataset.dish, parseInt(this.dataset.idx), 1); }); });
  stepsContainer.querySelectorAll('.flow-step-del').forEach(function(el){ el.addEventListener('click',function(){ deleteFlowStep(this.dataset.dish, parseInt(this.dataset.idx)); }); });
}

function addFlowStep() {
  var dishId = document.getElementById('flow-dish-selector').value;
  if (!dishId) { alert('请先选择菜品'); return; }
  var title = document.getElementById('flow-step-title').value.trim();
  if (!title) { alert('请输入步骤名称'); return; }

  if (!appData.flowSteps) appData.flowSteps = {};
  if (!appData.flowSteps[dishId]) appData.flowSteps[dishId] = [];
  var steps = appData.flowSteps[dishId];
  var maxOrder = 0;
  for (var i=0;i<steps.length;i++) { if ((steps[i].order||0) > maxOrder) maxOrder = steps[i].order||0; }

  var desc = prompt('步骤描述（可选）：', '');
  if (desc === null) return;

  steps.push({id:'fs'+Date.now(), title:title, desc:desc||'', order:maxOrder+1});
  saveData(appData);
  document.getElementById('flow-step-title').value = '';
  renderFlow();
}

function editFlowStep(dishId, idx) {
  var steps = appData.flowSteps[dishId];
  if (!steps) return;
  var step = steps[idx];
  var newTitle = prompt('修改步骤名称：', step.title);
  if (newTitle === null) return;
  newTitle = newTitle.trim();
  if (!newTitle) return;
  var newDesc = prompt('修改步骤描述：', step.desc||'');
  if (newDesc === null) return;
  step.title = newTitle;
  step.desc = newDesc.trim();
  saveData(appData);
  renderFlow();
}

function moveFlowStep(dishId, idx, dir) {
  var steps = appData.flowSteps[dishId];
  if (!steps) return;
  var newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= steps.length) return;
  var tmp = steps[idx];
  steps[idx] = steps[newIdx];
  steps[newIdx] = tmp;
  // 交换 order
  var tmpOrder = steps[idx].order;
  steps[idx].order = steps[newIdx].order;
  steps[newIdx].order = tmpOrder;
  saveData(appData);
  renderFlow();
}

function deleteFlowStep(dishId, idx) {
  var steps = appData.flowSteps[dishId];
  if (!steps) return;
  steps.splice(idx, 1);
  saveData(appData);
  renderFlow();
}

// ============ 每日轨迹模块 ====================================
// ============================================================
function renderTrack() {
  var dk = dateKey(selectedTrackDate);
  document.getElementById('track-date-display').textContent = fmtDate(selectedTrackDate);

  if (!appData.tracks) appData.tracks = {};
  var items = appData.tracks[dk] || [];

  var container = document.getElementById('track-timeline');
  if (items.length===0) {
    container.innerHTML = '<div class="track-empty">暂无轨迹记录<br><span style="font-size:13px">添加下方的时间段任务吧</span></div>';
    return;
  }

  // 按时间排序
  items.sort(function(a,b){
    if (a.time < b.time) return -1;
    if (a.time > b.time) return 1;
    return 0;
  });

  var html = '';
  for (var i=0;i<items.length;i++) {
    var item = items[i];
    html += '<div class="track-item">';
    if (i<items.length-1) html += '<div class="track-line"></div>';
    html += '<div class="track-time">'+item.time+'</div>';
    html += '<div class="track-dot'+(item.done?' done':'')+'"></div>';
    html += '<div class="track-card">';
    html += '<div class="track-title'+(item.done?' done':'')+'">'+item.title+'</div>';
    if (item.note) html += '<div class="track-note">'+item.note+'</div>';
    html += '<div class="track-actions">';
    html += '<button class="track-check-btn'+(item.done?' done':'')+'" data-dk="'+dk+'" data-idx="'+i+'">'+(item.done?'✓ 已完成':'○ 未完成')+'</button>';
    html += '<button class="track-edit-btn" data-dk="'+dk+'" data-idx="'+i+'">编辑</button>';
    html += '<button class="track-del" data-dk="'+dk+'" data-idx="'+i+'">删除</button>';
    html += '</div></div></div>';
  }
  container.innerHTML = html;

  container.querySelectorAll('.track-check-btn').forEach(function(el){ el.addEventListener('click',function(){ toggleTrackDone(this.dataset.dk, parseInt(this.dataset.idx)); }); });
  container.querySelectorAll('.track-edit-btn').forEach(function(el){ el.addEventListener('click',function(){ editTrackItem(this.dataset.dk, parseInt(this.dataset.idx)); }); });
  container.querySelectorAll('.track-del').forEach(function(el){ el.addEventListener('click',function(){ deleteTrackItem(this.dataset.dk, parseInt(this.dataset.idx)); }); });
}

function addTrackItem() {
  var time = document.getElementById('track-time').value;
  var title = document.getElementById('track-title').value.trim();
  if (!time) { alert('请选择时间'); return; }
  if (!title) { alert('请输入任务名称'); return; }

  var dk = dateKey(selectedTrackDate);
  if (!appData.tracks) appData.tracks = {};
  if (!appData.tracks[dk]) appData.tracks[dk] = [];

  var note = prompt('备注（可选）：', '');
  if (note === null) return;

  appData.tracks[dk].push({id:'tr'+Date.now(), time:time, title:title, note:note||'', done:false});
  saveData(appData);
  document.getElementById('track-title').value = '';
  renderTrack();
}

function toggleTrackDone(dk, idx) {
  var items = appData.tracks[dk];
  if (!items) return;
  items[idx].done = !items[idx].done;
  saveData(appData);
  renderTrack();
}

function editTrackItem(dk, idx) {
  var items = appData.tracks[dk];
  if (!items) return;
  var item = items[idx];
  var newTime = prompt('修改时间：', item.time);
  if (newTime === null) return;
  var newTitle = prompt('修改任务名称：', item.title);
  if (newTitle === null) return;
  newTitle = newTitle.trim();
  if (!newTitle) return;
  var newNote = prompt('修改备注：', item.note||'');
  if (newNote === null) return;
  item.time = newTime.trim() || item.time;
  item.title = newTitle;
  item.note = newNote.trim();
  saveData(appData);
  renderTrack();
}

function deleteTrackItem(dk, idx) {
  var items = appData.tracks[dk];
  if (!items) return;
  items.splice(idx, 1);
  if (items.length===0) delete appData.tracks[dk];
  saveData(appData);
  renderTrack();
}

// 轨迹日期导航
document.getElementById('track-prev').addEventListener('click',function(){
  selectedTrackDate.setDate(selectedTrackDate.getDate()-1);
  renderTrack();
});
document.getElementById('track-next').addEventListener('click',function(){
  selectedTrackDate.setDate(selectedTrackDate.getDate()+1);
  renderTrack();
});

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-overlay').forEach(function(ov){
  ov.addEventListener('click',function(e){ if(e.target===ov) ov.classList.remove('show'); });
});

  localStorage.removeItem(STORAGE_KEY);
  appData = getDefaultData();

}

// ============ 固定底部导航（兼容UC浏览器） ============
(function fixNav() {
  var nav = document.querySelector('.workbench-nav');
  if (!nav) return;
  var rafId;
  function stick() {
    nav.style.position = 'absolute';
    nav.style.bottom = '0px';
    nav.style.left = '0px';
    nav.style.right = '0px';
    nav.style.zIndex = '100';
    rafId = requestAnimationFrame(stick);
  }
  stick();
  window.addEventListener('beforeunload', function(){ cancelAnimationFrame(rafId); });
})();
</script>
